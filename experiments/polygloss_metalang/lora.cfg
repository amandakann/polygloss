[config]

mode = lora
pretrained_model = lecslab/polygloss-byt5-interleaved-2025-12-28

# Dataset
# dataset_key = lecslab/polygloss-corpus
local_dataset_path = /home/akann/data/gawarbati
task_format = interleaved

max_epochs = 25
learning_rate = 5e-4
batch_size = 16
grad_norm = 1
optimizer = adamw

target_modules = ["q", "v"]
lora_rank = 8

# glottocode and translation_condition are set per run, e.g.
#   --overrides glottocode=gawa1247 translation_condition=ur
